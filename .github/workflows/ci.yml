---
name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs, tags are mutable.
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # astral-sh/setup-uv v10.2.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy src tests
      - name: Tests with coverage
        run: uv run pytest --cov=src --cov-branch --cov-report=term-missing
      - name: Dependency audit
        run: |
          uv export --frozen --no-dev --no-hashes > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt
