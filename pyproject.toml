[project]
name = "telegram-claude-bridge"
version = "0.1.0"
description = "Telegram bot that drives a local Claude Code process and gates every tool call with approval buttons"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Andrea Bonacci" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4",
    "python-telegram-bot>=21",
]

[project.urls]
Repository = "https://github.com/AndreaBonn/claude-phone"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
